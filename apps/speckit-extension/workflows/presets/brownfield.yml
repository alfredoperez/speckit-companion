# A shipped starting point. Pick it from the pipeline panel — "New workflow…",
# then "Start from". Nothing here is final: everything it sets can be changed
# afterwards, one node or one section at a time.
preset: Brownfield
summary: For changing a system that already exists. The task list gets attacked before it runs, and a person opens the thing before it is called done.

commands:
  specify:
    nodes: [resolve-dir-git, draft-spec, quality-checklist, classify-size, persist-size, branch, finalize, handoff]
    phases:
      - name: gather
        nodes: [resolve-dir-git]
      - name: author
        nodes: [draft-spec, quality-checklist]
      - name: classify
        nodes: [classify-size, persist-size]
      - name: wrap-up
        nodes: [branch, finalize, handoff]

  tasks:
    nodes: [size-budget, tasks-doc, review-gaps, handoff]
    phases:
      - name: gather
        nodes: [size-budget]
      - name: author
        nodes: [tasks-doc, review-gaps]
      - name: wrap-up
        nodes: [handoff]

  implement:
    nodes: [implement-exec, record-verified, verify-manually, complete, handoff]
    phases:
      - name: execute
        nodes: [implement-exec, record-verified]
      - name: verify
        nodes: [verify-manually]
      - name: wrap-up
        nodes: [complete, handoff]
