# Canonical node order — the byte-parity baseline. A recipe's
# nodes: [...] replaces this list.
order:
  - resolve-dir
  - orchestrate
  - handoff

# `phases:` is the middle block: it groups these same nodes, in this same order,
# so a hook has a coarser place to attach than a single node and the builder has
# something to show between a step and its nodes. The flat `order:` above stays
# the authority on sequence; the phases must list exactly the same ids.

phases:
  - name: gather
    nodes: [resolve-dir]
  - name: orchestrate
    nodes: [orchestrate]
  - name: wrap-up
    nodes: [handoff]
