schema_version: "1.0"

extension:
  id: companion
  name: "SpecKit Companion"
  version: "0.25.0"
  description: "Records your spec-kit runs live: status, resume, and a health check for what actually happened."
  author: alfredoperez
  repository: https://github.com/alfredoperez/speckit-companion
  homepage: https://github.com/alfredoperez/speckit-companion/tree/main/apps/speckit-extension
  license: MIT

requires:
  # Floor is the workflow-engine surface the Companion workflow rides:
  # `specify workflow run`/`resume` plus the `command`/`gate`/`switch` step
  # registry, all present from the 0.9.5 engine. A bare floor is correct as
  # long as spec-kit's released line has moved past 0.9.5 — `.dev0` is only
  # needed when the floor equals the exact line spec-kit's git HEAD is
  # currently building (see spec-kit's own pyproject.toml version).
  # That condition has not held since 0.9.5 shipped stable, so the bare floor
  # blocks nobody. Do not "fix" this back to `>=0.9.5.dev0`: that pin was live
  # only while spec-kit HEAD built the 0.9.5 line, and was deliberately removed
  # in 0.20.2. The stale `0.9.5.dev0` strings under `examples/` are frozen
  # snapshots from that era, not versions anyone runs today.
  speckit_version: ">=0.9.5"
  tools:
    - name: python3
      required: false

provides:
  commands:
    - name: speckit.companion.before-step
      file: commands/speckit.companion.before-step.md
      description: "Capture a spec-kit step's start into .spec-context.json for the Companion GUI"
    - name: speckit.companion.after-specify
      file: commands/speckit.companion.after-specify.md
      description: "Capture the current spec-kit step into .spec-context.json for the Companion GUI"
    - name: speckit.companion.after-plan
      file: commands/speckit.companion.after-plan.md
      description: "Record the plan finish in .spec-context.json for the Companion GUI"
    - name: speckit.companion.after-tasks
      file: commands/speckit.companion.after-tasks.md
      description: "Record the tasks finish in .spec-context.json for the Companion GUI"
    - name: speckit.companion.after-implement
      file: commands/speckit.companion.after-implement.md
      description: "Record implement progress from tasks.md in .spec-context.json for the Companion GUI"
    - name: speckit.companion.before-converge
      file: commands/speckit.companion.before-converge.md
      description: "Record the converge start in .spec-context.json for the Companion GUI"
    - name: speckit.companion.after-converge
      file: commands/speckit.companion.after-converge.md
      description: "Record the converge finish in .spec-context.json for the Companion GUI"
    - name: speckit.companion.status
      file: commands/speckit.companion.status.md
      description: "Report where the active spec stands — current step, status, recorded decisions, and the next action — from .spec-context.json"
    - name: speckit.companion.resume
      file: commands/speckit.companion.resume.md
      description: "Continue the spec-driven pipeline from the last completed step, carrying recorded decisions into scope, and dispatch the next command"
    - name: speckit.companion.specify
      file: commands/speckit.companion.specify.md
      description: "Companion specify — a feature spec with prioritized user stories"
    - name: speckit.companion.plan
      file: commands/speckit.companion.plan.md
      description: "Companion plan — implementation plan with research & design artifacts"
    - name: speckit.companion.tasks
      file: commands/speckit.companion.tasks.md
      description: "Companion tasks — user-story phased task list"
    - name: speckit.companion.implement
      file: commands/speckit.companion.implement.md
      description: "Companion implement — execute tasks.md in dependency order, then mark complete"
    - name: speckit.companion.classify
      file: commands/speckit.companion.classify.md
      description: "Classify the change size (simple | normal | oversized) so the Companion workflow can right-size the pipeline"
    - name: speckit.companion.mark-complete
      file: commands/speckit.companion.mark-complete.md
      description: "Mark the active spec completed — the Companion workflow's terminal step (writes status: completed)"
    - name: speckit.companion.auto
      file: commands/speckit.companion.auto.md
      description: "Companion auto — run the whole pipeline hands-off (specify → plan → tasks → implement → mark-complete), no pauses"
    - name: speckit.companion.doctor
      file: commands/speckit.companion.doctor.md
      description: "Report on a spec's run health — unfinished steps, unjournaled tasks, step bleed, drift you can judge, a step that closed having verified nothing, a step that closed without the file it promised, and why completion did not land (read-only, retroactive, never halts)"
    - name: speckit.companion.living-adopt
      file: commands/speckit.companion.living-adopt.md
      description: "Brownfield adoption wizard — draft living specs for the code areas you name, central or colocated, and register them (opt-in, surface-first, [DRAFT])"
    - name: speckit.companion.living-move
      file: commands/speckit.companion.living-move.md
      description: "Move a living spec between central and colocated storage — file, tiers, and registry together (opt-in, reversible)"
    - name: speckit.companion.living-drift
      file: commands/speckit.companion.living-drift.md
      description: "Report living-spec drift — per capability, the source files changed since the spec was last committed (opt-in, never halts)"
    - name: speckit.companion.living-show
      file: commands/speckit.companion.living-show.md
      description: "Print one slice of a living spec — a capability's requirement headings, one requirement in full, or the requirements that describe one file (opt-in, read-only, never halts)"
    - name: speckit.companion.living-validate
      file: commands/speckit.companion.living-validate.md
      description: "Check the shape of living specs and a feature spec's deltas — a requirement with no scenario, a scenario missing WHEN or THEN, a duplicate heading, a delta pointing at nothing (opt-in, read-only, never halts)"
    - name: speckit.companion.living-coverage
      file: commands/speckit.companion.living-coverage.md
      description: "Report living-spec requirement→test coverage — per requirement, whether its coverage tier maps a test (opt-in, read-only, never halts)"
    - name: speckit.companion.living-sync
      file: commands/speckit.companion.living-sync.md
      description: "Sync living specs from your current changes — group working-tree changes (uncommitted included) by capability and update every affected spec in one pass (opt-in, update-not-regenerate, never halts)"
    - name: speckit.companion.on-prompt
      file: commands/speckit.companion.on-prompt.md
      description: "Record a step's start from spec-kit's prompt-submitted event"
    - name: speckit.companion.on-stop
      file: commands/speckit.companion.on-stop.md
      description: "Record a step's finish from spec-kit's turn-ended event"

hooks:
  before_specify:
    command: speckit.companion.before-step
    optional: false
    description: "Save the specify start time until its folder exists"
  before_plan:
    command: speckit.companion.before-step
    optional: false
    description: "Record the plan start"
  before_tasks:
    command: speckit.companion.before-step
    optional: false
    description: "Record the tasks start"
  before_implement:
    command: speckit.companion.before-step
    optional: false
    description: "Record the implement start"
  after_specify:
    command: speckit.companion.after-specify
    optional: false
    description: "Record the specify start and finish"
  after_plan:
    command: speckit.companion.after-plan
    optional: false
    description: "Record the plan finish"
  after_tasks:
    command: speckit.companion.after-tasks
    optional: false
    description: "Record the tasks finish"
  after_implement:
    command: speckit.companion.after-implement
    optional: false
    description: "Sync implement progress from tasks.md"
  before_converge:
    command: speckit.companion.before-converge
    optional: false
    description: "Record the converge start"
  after_converge:
    command: speckit.companion.after-converge
    optional: false
    description: "Record the converge finish"

events:
  user_prompt_submit:
    command: speckit.companion.on-prompt
    timeout: 10
  stop:
    command: speckit.companion.on-stop
    timeout: 10

# Catalog `category` (process) and `effect` (read-write) live only in the
# community catalog entry — there is no field for them here.
tags:
  - "vscode"
  - "progress"
  - "living-specs"
  - "drift"
  - "hooks"
