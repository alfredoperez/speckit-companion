<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="SpecKit Companion">
  <title>SpecKit Companion</title>
  <!--
    The SMALL CUT of the mark, not a copy of it. The full mark is
    src/components/LogoMark.astro; measured at real pixels it fails as an icon,
    because at 32 the checkmark inside the right chevron has already vanished
    and at 16 the whole thing is one violet blob.

    Three changes, and each one buys pixels back:
      no checkmark      it was the first thing to go anyway
      thicker strokes   4.6 of 32, so 2.3 real pixels at 16 rather than 1.5
      a wider gap       11.1 between the two apexes, so a dark column survives
                        between the chevrons instead of closing up
    Both chevrons stay: one alone reads as a generic play arrow and loses the
    forward motion the pair carries. Violet left, pale right, same as the full
    mark — at 16px the colour split does more work separating them than the gap.

    Colours are literal because a favicon is fetched on its own and a CSS
    custom property has nothing to resolve against. The ground is opaque for the
    same reason the mascot icon's was: the pale chevron on a transparent icon
    would be invisible against a light tab bar.
  -->
  <rect width="32" height="32" rx="7" fill="#0a0913" />
  <path
    d="M6.6 10L12.6 16L6.6 22"
    fill="none"
    stroke="#a78bfa"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M17.7 10L23.7 16L17.7 22"
    fill="none"
    stroke="#edeaf6"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
