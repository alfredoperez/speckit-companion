enabled: true
exempt:
- '**/*.config.*'
- '**/*.test.*'
- '**/__tests__/**'
- '**/__stories__/**'
- '**/__fixtures__/**'
- '**/*.stories.*'
- '**/migrations/**'
- '**/index.ts'
- apps/vscode/src/core/types/config.ts
- apps/*/tests/**
- tests/**
capabilities:
- name: choose-an-assistant
  match:
  - apps/vscode/src/**
  spec: capabilities/ai-providers/choose-an-assistant.spec.md
- name: pick-a-workflow
  match:
  - apps/vscode/src/features/specs/**
  - apps/vscode/src/features/workflows/**
  spec: capabilities/ai-providers/pick-a-workflow.spec.md
- name: send-a-command-to-the-assistant
  match:
  - apps/vscode/src/ai-providers/**
  - apps/vscode/src/core/utils/installUtils.ts
  - apps/vscode/src/speckit/detector.ts
  spec: capabilities/ai-providers/send-a-command-to-the-assistant.spec.md
- name: customize-the-pipeline
  match:
  - apps/speckit-extension/fragments/**
  - apps/speckit-extension/nodes/**
  - apps/speckit-extension/presets/_parts/**
  - apps/speckit-extension/scripts/**
  - apps/speckit-extension/workflows/presets/**
  spec: capabilities/companion-pipeline/customize-the-pipeline.spec.md
- name: right-size-a-change
  match:
  - apps/speckit-extension/commands/**
  - apps/speckit-extension/nodes/plan/**
  - apps/speckit-extension/nodes/specify/**
  - apps/speckit-extension/nodes/tasks/size-budget.md
  - apps/speckit-extension/presets/_parts/**
  - apps/speckit-extension/scripts/**
  - apps/speckit-extension/workflows/speckit-companion.workflow.yml
  spec: capabilities/companion-pipeline/right-size-a-change.spec.md
- name: run-a-spec-through-the-pipeline
  match:
  - apps/speckit-extension/commands/**
  - apps/speckit-extension/extension.yml
  - apps/speckit-extension/nodes/**
  - apps/speckit-extension/presets/_parts/**
  - apps/speckit-extension/presets/companion-standard/**
  - apps/speckit-extension/scripts/dispatch-briefs.py
  - apps/speckit-extension/workflows/**
  spec: capabilities/companion-pipeline/run-a-spec-through-the-pipeline.spec.md
- name: split-work-across-workers
  match:
  - apps/speckit-extension/nodes/implement/**
  - apps/speckit-extension/nodes/plan/**
  - apps/speckit-extension/nodes/specify/draft-spec.md
  - apps/speckit-extension/nodes/tasks/tasks-doc.md
  - apps/speckit-extension/presets/_parts/timing.md
  - apps/speckit-extension/scripts/**
  spec: capabilities/companion-pipeline/split-work-across-workers.spec.md
- name: keep-the-companion-extension-current
  match:
  - apps/vscode/src/**
  - apps/vscode/webview/styles/spec-viewer/_install-banner.css
  - package.json
  spec: capabilities/extension-services/keep-the-companion-extension-current.spec.md
- name: see-changes-from-disk
  match:
  - apps/vscode/src/core/specDirectoryResolver.ts
  - apps/vscode/src/core/utils/notificationUtils.ts
  - apps/vscode/src/extension.ts
  - apps/vscode/src/features/**
  - apps/vscode/src/speckit/taskProgressService.ts
  - package.json
  spec: capabilities/extension-services/see-changes-from-disk.spec.md
- name: set-up-and-update
  match:
  - apps/vscode/src/**
  - package.json
  spec: capabilities/extension-services/set-up-and-update.spec.md
- name: share-anonymous-usage
  match:
  - apps/vscode/src/**
  - package.json
  spec: capabilities/extension-services/share-anonymous-usage.spec.md
- name: fold-a-finished-change-back
  match:
  - apps/speckit-extension/scripts/**
  spec: capabilities/living-specs-engine/fold-a-finished-change-back.spec.md
- name: keep-specs-honest
  match:
  - apps/speckit-extension/commands/**
  - apps/speckit-extension/scripts/**
  spec: capabilities/living-specs-engine/keep-specs-honest.spec.md
- name: load-specs-for-a-change
  match:
  - apps/speckit-extension/commands/speckit.companion.living-show.md
  - apps/speckit-extension/scripts/**
  spec: capabilities/living-specs-engine/load-specs-for-a-change.spec.md
- name: register-living-specs
  match:
  - apps/speckit-extension/commands/**
  - apps/speckit-extension/scripts/**
  spec: capabilities/living-specs-engine/register-living-specs.spec.md
- name: find-a-living-spec
  match:
  - apps/vscode/src/extension.ts
  - apps/vscode/src/features/living-specs/**
  - apps/vscode/webview/src/spec-viewer/components/OverviewDossier.tsx
  - apps/vscode/webview/src/spec-viewer/components/cards/LivingSpecsCard.tsx
  - package.json
  spec: capabilities/living-specs-in-vscode/find-a-living-spec.spec.md
- name: keep-living-specs-current
  match:
  - apps/vscode/src/features/living-specs/**
  - apps/vscode/src/features/spec-viewer/messageHandlers.ts
  - apps/vscode/src/features/specs/**
  - apps/vscode/webview/src/spec-viewer/App.tsx
  - apps/vscode/webview/src/spec-viewer/components/footer/LivingFooter.tsx
  - package.json
  spec: capabilities/living-specs-in-vscode/keep-living-specs-current.spec.md
- name: review-a-living-spec
  match:
  - apps/vscode/src/features/living-specs/**
  - apps/vscode/src/features/spec-viewer/**
  - apps/vscode/webview/src/spec-viewer/**
  spec: capabilities/living-specs-in-vscode/review-a-living-spec.spec.md
- name: attach-a-hook
  match:
  - apps/vscode/src/features/pipeline-builder/**
  - apps/vscode/src/features/specs/**
  - apps/vscode/webview/src/pipeline-builder/**
  spec: capabilities/pipeline-builder/attach-a-hook.spec.md
- name: read-the-pipeline
  match:
  - apps/vscode/src/features/pipeline-builder/**
  - apps/vscode/src/features/specs/**
  - apps/vscode/webview/src/pipeline-builder/**
  spec: capabilities/pipeline-builder/read-the-pipeline.spec.md
- name: reshape-a-step
  match:
  - apps/vscode/src/features/pipeline-builder/**
  - apps/vscode/src/features/specs/**
  - apps/vscode/webview/src/pipeline-builder/**
  spec: capabilities/pipeline-builder/reshape-a-step.spec.md
- name: switch-workflows-and-build
  match:
  - apps/vscode/src/features/pipeline-builder/**
  - apps/vscode/src/features/specs/**
  - apps/vscode/webview/src/pipeline-builder/**
  spec: capabilities/pipeline-builder/switch-workflows-and-build.spec.md
- name: produce-the-docs-media
  match:
  - .storybook/capture-theme.ts
  - README.md
  - apps/speckit-extension/**
  - apps/vscode/webview/src/spec-viewer/__stories__/captureFrame.tsx
  - apps/website/scripts/sync-media.mjs
  - content/media/**
  - docs/screenshots/generated/**
  - package.json
  - tooling/scripts/**
  spec: capabilities/repo-tooling/produce-the-docs-media.spec.md
- name: release-the-spec-kit-extension
  match:
  - .github/workflows/release.yml
  - apps/speckit-extension/**
  spec: capabilities/repo-tooling/release-the-spec-kit-extension.spec.md
- name: diagnose-a-run
  match:
  - apps/speckit-extension/commands/speckit.companion.doctor.md
  - apps/speckit-extension/scripts/**
  spec: capabilities/run-record/diagnose-a-run.spec.md
- name: protect-the-run-record
  match:
  - apps/speckit-extension/scripts/**
  - apps/vscode/src/features/specs/**
  spec: capabilities/run-record/protect-the-run-record.spec.md
- name: record-a-run
  match:
  - apps/speckit-extension/commands/speckit.companion.after-*.md
  - apps/speckit-extension/commands/speckit.companion.after-implement.md
  - apps/speckit-extension/presets/_parts/timing.md
  - apps/speckit-extension/scripts/**
  - apps/vscode/src/core/types/**
  spec: capabilities/run-record/record-a-run.spec.md
- name: see-where-a-spec-stands
  match:
  - apps/speckit-extension/commands/**
  - apps/speckit-extension/scripts/**
  - apps/vscode/src/features/specs/**
  spec: capabilities/run-record/see-where-a-spec-stands.spec.md
- name: act-on-a-spec
  match:
  - apps/vscode/src/features/specs/**
  - package.json
  spec: capabilities/sidebar/act-on-a-spec.spec.md
- name: browse-specs
  match:
  - apps/vscode/src/core/utils/specDisplayName.ts
  - apps/vscode/src/features/specs/**
  spec: capabilities/sidebar/browse-specs.spec.md
- name: browse-steering-files
  match:
  - apps/vscode/src/features/agents/**
  - apps/vscode/src/features/skills/**
  - apps/vscode/src/features/steering/**
  - package.json
  spec: capabilities/sidebar/browse-steering-files.spec.md
- name: open-the-sidebar
  match:
  - apps/vscode/src/**
  - package.json
  spec: capabilities/sidebar/open-the-sidebar.spec.md
- name: describe-a-new-spec
  match:
  - apps/vscode/src/features/spec-editor/**
  - apps/vscode/webview/src/spec-editor/**
  spec: capabilities/spec-editor/describe-a-new-spec.spec.md
- name: hand-a-brief-to-the-assistant
  match:
  - apps/vscode/src/ai-providers/**
  - apps/vscode/src/features/spec-editor/**
  - apps/vscode/src/features/workflows/**
  - apps/vscode/webview/src/spec-editor/**
  spec: capabilities/spec-editor/hand-a-brief-to-the-assistant.spec.md
- name: comment-on-a-spec
  match:
  - apps/vscode/src/features/spec-viewer/**
  - apps/vscode/webview/src/spec-viewer/components/**
  - apps/vscode/webview/src/spec-viewer/editor/**
  - apps/vscode/webview/src/spec-viewer/markdown/renderer.ts
  spec: capabilities/spec-viewer/comment-on-a-spec.spec.md
- name: move-a-spec-forward
  match:
  - apps/vscode/src/features/spec-viewer/**
  - apps/vscode/webview/src/spec-viewer/components/**
  - apps/vscode/webview/src/spec-viewer/stepInFlight.ts
  spec: capabilities/spec-viewer/move-a-spec-forward.spec.md
- name: read-a-spec
  match:
  - apps/vscode/src/features/spec-viewer/**
  - apps/vscode/webview/src/spec-viewer/**
  spec: capabilities/spec-viewer/read-a-spec.spec.md
- name: see-what-the-run-recorded
  match:
  - apps/vscode/webview/src/spec-viewer/components/**
  spec: capabilities/spec-viewer/see-what-the-run-recorded.spec.md
- name: work-through-a-document
  match:
  - apps/vscode/src/features/spec-viewer/**
  - apps/vscode/webview/src/spec-viewer/**
  spec: capabilities/spec-viewer/work-through-a-document.spec.md
- name: webview-safety
  match:
  - apps/vscode/src/features/spec-viewer/html/**
  - apps/vscode/webview/src/pipeline-builder/**
  - apps/vscode/webview/src/spec-editor/**
  - apps/vscode/webview/src/spec-viewer/**
  spec: capabilities/webview-safety/webview-safety.spec.md
- name: operating-a-panel
  match:
  - apps/vscode/webview/src/shared/**
  - apps/vscode/webview/styles/**
  spec: capabilities/webview-shared/operating-a-panel.spec.md
- name: reading-a-panel
  match:
  - apps/vscode/webview/src/shared/**
  - apps/vscode/webview/styles/**
  spec: capabilities/webview-shared/reading-a-panel.spec.md

