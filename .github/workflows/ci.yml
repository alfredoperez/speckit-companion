name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Type-check the webview
        run: npx tsc -p tsconfig.webview.json --noEmit

      - name: Run tests
        run: npm test

  capture-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run capture tests (stdlib unittest, no deps)
        run: python3 -m unittest discover -s apps/speckit-extension/tests -p "test_*.py"

      # build.py --check runs the shape-parity sweep itself, so it is not a
      # separate step.
      - name: Check command bodies (part fills, preset goldens, node-assembly parity)
        run: python3 apps/speckit-extension/scripts/build.py --check

      - name: Check release packaging (every script a shipped command calls is packaged)
        run: python3 apps/speckit-extension/scripts/package-manifest.py --check

      - name: Check command inventory (emissions, install records, and docs match the manifest)
        run: python3 apps/speckit-extension/scripts/check-command-emissions.py

      # A ratchet, not the ideal ceiling: the bodies are already over 40, so gating
      # on 40 would be red from the first build and get switched off. This fails
      # only when a command carries MORE directives than it did, which is the
      # regression worth catching. Shedding some is always fine; --record locks it in.
      - name: Check the instruction budget per command (ratchet)
        run: python3 apps/speckit-extension/scripts/instruction-budget.py --strict

      - name: Report what a run of the pipeline is expected to produce
        run: python3 apps/speckit-extension/scripts/manifest.py

      - name: Command-quality eval (verbosity/timing on fixture specs, prompting on command sources)
        run: |
          python3 apps/speckit-extension/scripts/check_quality.py --strict --feature-dir specs/509-timing-capture
          python3 apps/speckit-extension/scripts/check_quality.py --strict --feature-dir specs/510-living-sync
          python3 apps/speckit-extension/scripts/check_quality.py --strict --feature-dir specs/514-fast-path-fixture
          python3 apps/speckit-extension/scripts/check_quality.py --strict --commands-dir apps/speckit-extension/commands

  visual-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser needed, so it runs first and fails fast.
      - name: Check storyboard drift and the media manifest
        run: npm run clips:check

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Pipeline Builder visual gate (layout only)
        run: npm run test:visual:ci
