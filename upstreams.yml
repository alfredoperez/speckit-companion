version: 1
# What SpecKit Companion follows upstream. spec-kit is pinned to the release the
# extension was last verified against, so `npm run upstreams` can say what moved
# since: a new command, template, script, CLI flag or extension/workflow API the
# extension should support. Same schema as kaiju's upstreams.yml; `supports` is
# this repo's role, and it is watched.
#
#   npm run upstreams                        what moved since the pin
#   npm run upstreams -- --apply             we looked: restamp last_checked
#   npm run upstreams -- --adopt <id>        support verified: move the pin
#
# Look about once a month, and before a release that claims a spec-kit version.
# Record what was worth supporting in `notes`.
upstreams:
  - id: spec-kit
    name: GitHub Spec Kit
    skills: []
    role: supports
    kind: repo
    url: https://github.com/github/spec-kit
    repo: github/spec-kit
    paths:
      - CHANGELOG.md
      - templates/
      - scripts/bash/
      - src/specify_cli/
      - extensions/EXTENSION-API-REFERENCE.md
      - extensions/RFC-EXTENSION-SYSTEM.md
      - extensions/git/
      - workflows/ARCHITECTURE.md
      - workflows/speckit/
      - workflows/step-catalog.json
      - presets/ARCHITECTURE.md
      - integrations/catalog.json
    ref: 4ca46a0706a662b1edc07086ef16f021820c2db0
    ref_date: 2026-10-13
    last_checked: 2026-10-15
    license: MIT
    what: >-
      The engine the extension drives: `/speckit.*` commands and their templates,
      the bash scripts they call, the `specify` CLI (init, extension, workflow),
      the extension and workflow-step APIs our spec-kit extension rides, and the
      integration catalog that decides which agents the extension can target.
    notes: >-
      Pinned to the v1.2.0 tag commit, adopted 2026-10-15: the repo's fixtures were refreshed
      with `specify` 1.2.0 (claude default, codex and copilot command sets, git
      extension 1.0.1, bundled workflow 1.0.1), the full suite passed, and the
      Copilot canvas now reads `feature_numbering` before `branch_numbering`.
      Still unsupported from 1.2.0: the bundled `github` extension's
      `speckit.github.taskstoissues` (the viewer still sends the deprecated core
      `speckit.taskstoissues`); the `agent-context` extension and the bundled
      `assess`/`bugfix` workflows as their own pipelines; Claude
      `--no-model-invocation`; the GitHub workflow step and composed workflows;
      `--json` on version, preset info and extension info; the experimental MCP
      server; MiniMax Code and catalog-installed agent adapters; `--script py`;
      timestamp numbering and git `branch_template` in Companion's own folder and
      branch creation; hook `priority` ordering in Companion's command bodies.
      Extension commands now register only for the default integration, so the
      codex and copilot fixtures no longer carry the git commands.
      The extension's install floor stays >=0.9.5 in
      apps/speckit-extension/extension.yml; the pin is about what we have read,
      not what we require. Community catalogs are left out of paths because they
      change daily and never need support work.
