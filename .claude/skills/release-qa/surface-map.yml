# Turns the files a release changed into the QA checklist.
# Input: `git diff --name-only <last v* tag>..HEAD`. A path may match several surfaces; take the union of their checks and run each check id once.
# `**` spans directories. A changed path that matches no surface and no `ignore` glob is reported as "no QA mapping" so this file gets extended.
# New surface ships (app, panel, provider, top-level feature path)? Add its globs and checks here.

checks:
  # auto: Bash only, runs before any desktop time.
  jest: { kind: auto, run: "npm test" }
  canvas-tests: { kind: auto, run: "npm run test:canvas" }
  mod-tests: { kind: auto, run: "npm run test:mod && claude plugin validate --strict ./apps/claude-mod" }
  clips-check: { kind: auto, run: "npm run clips:check", pass: "0 broken" }
  docs-build: { kind: auto, run: "cd apps/website && npm run build && npx astro check" }
  speckit-ext-tests: { kind: auto, run: "python3 -m unittest discover -s apps/speckit-extension/tests -p 'test_*.py' && python3 apps/speckit-extension/scripts/check_shape_parity.py" }
  check-capture: { kind: auto-after, run: "python3 apps/speckit-extension/scripts/check_capture.py <spec dir>", after: terminal-run, note: "vscode-run and canvas-new-spec run it on their own spec inside their recipes" }

  # run: Bash drives it, no eyes needed. Timed with `timing.py`, surface `terminal`.
  terminal-run: { kind: run, recipe: "Terminal run", what: "`/speckit.companion.auto` on one small spec through the terminal CLI, then check-capture" }

  # scripted: `tooling/scripts/desktop-check.mjs` drives a real VS Code window with a stand-in assistant; no eyes needed. `steps` are the step names that decide the check; `grade-scripted.py` reads them from `.desktop-check/results.<theme>.json`. `themes: both` also needs each step in the dark run.
  themes: { kind: scripted, run: "npm run check:desktop", steps: [sidebar-panes, narrow-panel-spec, narrow-panel-tasks, nav-n7], themes: both, what: "the sidebar, the viewer on Spec and Tasks at a narrow width, and the rail hold their layout in Quiet Light and in Dark Modern; colour and contrast are judged by looking at the `.dark.png` pictures" }
  nav-matrix: { kind: scripted, run: "npm run check:desktop", steps: [nav-n1, nav-n2, nav-n3, nav-n4, nav-n5, nav-n6, nav-n7, nav-n8, nav-n9, nav-n10, nav-n11, nav-n12, nav-n13, nav-n14, nav-n15, nav-links, nav-empty-record], what: "sidebar and viewer navigation, rows N1 to N15, the Links section and the empty-record tab title" }
  narrow-panel: { kind: scripted, run: "npm run check:desktop", steps: [narrow-panel-spec, narrow-panel-tasks], what: "the viewer in a narrow column: header, rail and footer buttons neither clip nor overflow on Spec and on Tasks" }
  popups: { kind: scripted, run: "npm run check:desktop", steps: [create-issues-confirm, create-issues-cancel, popup-provider-changed], what: "the messages the scripted flows raise appear once and their buttons act; a message the diff touches that no step raises gets one desktop check of its own (grep the changed files for `showInformationMessage|showWarningMessage|showErrorMessage`)" }
  provider-dispatch: { kind: scripted, run: "npm run check:desktop", steps: [provider-dispatch, bug-next-step, converge-sends], what: "a footer button, Fix bug and Converge each reach the terminal with their command; the first-start provider picker is captured by `npm run shots`" }
  builder: { kind: scripted, run: "npm run check:desktop", steps: [builder-phase-menu, builder-add-step, builder-narrow, builder-move-to-phase], what: "a phase menu opens, Add step opens its form, the builder holds one column at a narrow width, Move to phase moves a node" }
  process-panes: { kind: scripted, run: "npm run check:desktop", steps: [sidebar-panes, bug-story, bug-report-tab, idea-decision, idea-assessing, new-bug], what: "the Bugs and Ideas panes list their groups, a bug opens on its Story and its raw report, ideas open decided or assessing, New Bug opens the create screen; the install row in a project without the extensions rides on the stock-workspace check" }

  # desktop: needs eyes, so it is on the Claude Desktop handoff or looked at by Claude Code. `recipe` names the section of SKILL.md that says how (`## Recipe: ...`, then `### ...`).
  first-open: { kind: desktop, recipe: "Clean profile and workspace variants › First open", what: "the packaged .vsix in a fresh profile with workspace trust on: Restricted Mode first, then Trust" }
  vscode-run: { kind: desktop, recipe: "VS Code pass › Full run, timed", what: "one small spec through VS Code's own buttons (specify, plan, tasks, implement), timed" }
  stock-workspace: { kind: desktop, recipe: "Clean profile and workspace variants › Stock workspace", what: "a workspace with spec-kit and no Companion: read every popup and use its main button once" }
  multi-root: { kind: desktop, recipe: "Clean profile and workspace variants › Multi-root", what: "the sandbox plus the stock workspace in one window: sidebar, viewer and New Spec target the right root" }
  canvas-open: { kind: desktop, recipe: "Copilot canvas pass › Bare open", what: "open the canvas three times without editing anything: the board checks pass on the first open, the board renders on the next two, and the sandbox `git status --short` never changes" }
  mod-terminal: { kind: desktop, recipe: "Claude Code mod pass", what: "start `claude --plugin-dir ./apps/claude-mod` in a project with specs in a terminal at least 144 columns wide: the band names the latest spec, the pane opens beside the transcript, `/spec` lists specs and switching one updates both, and checking a task in its tasks.md ticks the band within a few seconds" }
  canvas-new-spec: { kind: desktop, recipe: "Copilot canvas pass › Full run", what: "New spec once per workflow (stock Spec Kit and Companion); the chat receives the matching command each time, in the spelling the project registers, plus one sentence naming the run-instructions file" }
  site-pages: { kind: desktop, recipe: "Website pages", what: "serve with `npm run preview` in apps/website and look at each changed page in a browser" }

# Runs on every release whatever the diff says.
baseline: [vscode-run, terminal-run, first-open, stock-workspace, multi-root, themes]

surfaces:
  - name: webview and feature UI
    paths: ["apps/vscode/webview/**", "apps/vscode/src/features/**"]
    checks: [jest, clips-check, nav-matrix, themes, narrow-panel, popups]

  - name: AI providers
    paths: ["apps/vscode/src/ai-providers/**"]
    checks: [jest, provider-dispatch]

  - name: spec-kit extension
    paths: ["apps/speckit-extension/**"]
    checks: [speckit-ext-tests, terminal-run, check-capture]

  - name: Copilot canvas
    paths: ["apps/copilot-canvas/**", ".github/extensions/**"]
    checks: [canvas-tests, canvas-open, canvas-new-spec]

  - name: Claude Code mod
    paths: ["apps/claude-mod/**", ".claude-plugin/**", "apps/copilot-canvas/spec-rules.mjs"]
    checks: [mod-tests, mod-terminal]

  - name: website
    paths: ["apps/website/**"]
    checks: [docs-build, site-pages]

  - name: workflow builder
    paths:
      - "apps/vscode/src/features/pipeline-builder/**"
      - "apps/vscode/src/features/specs/pipelineBuildCommands.ts"
      - "apps/vscode/webview/src/pipeline-builder/**"
      - "apps/vscode/webview/styles/pipeline-builder.css"
    checks: [builder]

  - name: bugs and ideas panes
    paths:
      - "apps/vscode/src/features/bugs/**"
      - "apps/vscode/src/features/ideas/**"
      - "apps/vscode/src/features/processes/**"
      - "apps/vscode/src/features/reports/**"
      - "apps/vscode/src/speckit/processExtensions.ts"
    checks: [jest, process-panes]

  - name: extension host
    paths: ["apps/vscode/src/**", "package.json"]
    checks: [jest]

  - name: docs only
    paths: ["docs/**", "*.md"]
    checks: [docs-build]

  - name: media
    paths: ["content/**", "assets/**"]
    checks: [clips-check, docs-build]

  - name: QA harness
    paths: ["tooling/scripts/desktop-check.mjs", "tooling/scripts/lib/**"]
    checks: [nav-matrix, themes, narrow-panel, popups, provider-dispatch, builder, process-panes]

# Changed paths that need no QA (not shipped, or covered by the baseline).
ignore: [".claude/**", ".serena/**", "specs/**", "package-lock.json"]
